<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jamily Reunion brings Twitch, TikTok LIVE, and YouTube live chat together for streamers.">
    <title>Jamily Reunion</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid #dce4f0;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(31, 54, 92, 0.09);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #536985;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #16243a;
        font-size: clamp(2.35rem, 8vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.055em;
      }

      .description {
        max-width: 34rem;
        margin: 1.4rem 0 2.5rem;
        color: #42536a;
        font-size: clamp(1.05rem, 3vw, 1.25rem);
        line-height: 1.7;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e7edf5;
        color: #61718a;
        font-size: 0.95rem;
      }

      footer p { margin: 0; }

      a {
        color: #315bcb;
        font-weight: 650;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid #84a5ff;
        outline-offset: 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">For streamers</p>
      <h1>Jamily Reunion</h1>
      <p class="description">A free Windows companion app for streamers that brings Twitch, TikTok LIVE, and YouTube live chat together in one place, with a community leaderboard.</p>
      <footer>
        <p>Created by @Alacajam</p>
        <a href="privacy.html">Privacy Policy</a>
      </footer>
    </main>
  </body>
</html>
